    <section class="intro"><div><p class="eyebrow">MATERIAL WORKSPACE</p><h1>从这里，开始制作。</h1><p class="intro-note">选择材料类型，进入对应工作台。填写、预览，再导出你的案例素材。</p></div><div class="overview"><b id="module-count">—</b><span>个工作台</span><small id="running-count" role="status">均可在线使用</small></div></section>
    <section aria-labelledby="workbenches-title" id="workbenches-section"><div class="section-head"><h2 id="workbenches-title">全部工作台</h2><span class="muted">选择一个工作台开始</span></div><p id="connection-error" class="connection-error" role="alert" hidden></p><div id="workbenches" class="workbenches" aria-live="polite"><p class="loading">正在载入工作台…</p></div></section>
    <section class="usage" aria-label="使用说明"><div><span class="step">01</span><h3>进入工作台</h3><p>在新标签页打开，直接在线填写和导出。</p></div><div><span class="step">02</span><h3>接着原来的方案做</h3><p>草稿保存在此浏览器；本机方案可导出后导入。</p></div><div><span class="step">03</span><h3>完成后回到这里</h3><p>工作台顶部的“素材中心”可随时返回总入口。</p></div></section>
